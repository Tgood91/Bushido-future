  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // 1. Comprehensive suppression filter
        var isSuppressed = function(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (typeof arg === 'string') {
              var s = arg.toLowerCase();
              if (
                arg.indexOf('APKT002') !== -1 ||
                arg.indexOf('allow list') !== -1 ||
                arg.indexOf('ORIGIN_NOT_ALLOWED') !== -1 ||
                s.indexOf('relay.walletconnect') !== -1 ||
                s.indexOf('walletconnect.org') !== -1 ||
                s.indexOf('walletconnect.com') !== -1 ||
                s.indexOf('socket connection') !== -1 ||
                s.indexOf('couldn\'t establish socket connection') !== -1 ||
                s.indexOf('could not establish socket connection') !== -1 ||
                s.indexOf('websocket connection closed') !== -1 ||
                s.indexOf('unauthorized: origin not allowed') !== -1 ||
                s.indexOf('core/subscription') !== -1 ||
                s.indexOf('code: 3000') !== -1 ||
                s.indexOf('siwxutil') !== -1 ||
                s.indexOf('popup window was blocked') !== -1 ||
                s.indexOf('popup was blocked') !== -1 ||
                s.indexOf('popup_blocked') !== -1 ||
                s.indexOf('getethjsonrpcerror') !== -1 ||
                s.indexOf('user rejected') !== -1 ||
                s.indexOf('user rejected the request') !== -1 ||
                s.indexOf('action_rejected') !== -1 ||
                s.indexOf('code":4001') !== -1 ||
                s.indexOf('code: 4001') !== -1 ||
                s.indexOf('on-chain execution failed') !== -1 ||
                s.indexOf('execution reverted') !== -1 ||
                s.indexOf('call_exception') !== -1 ||
                s.indexOf('estimategas') !== -1 ||
                s.indexOf('0x1b10b0f9') !== -1 ||
                s.indexOf('0x1111111254eeb25477b68fb85ed929f73a960582') !== -1
              ) {
                return true;
              }
            }
            if (arg && typeof arg === 'object') {
              if (
                arg.code === 'APKT002' ||
                arg.code === 3000 ||
                arg.code === 4001 ||
                arg.code === '4001' ||
                arg.code === 'ACTION_REJECTED' ||
                arg.code === 'CALL_EXCEPTION' ||
                arg.alertErrorKey === 'ORIGIN_NOT_ALLOWED' ||
                arg.action === 'estimateGas' ||
                arg.data === '0x1b10b0f9'
              ) return true;

              if (arg.context && typeof arg.context === 'string' && (arg.context.indexOf('core') !== -1 || arg.context.indexOf('subscription') !== -1)) {
                return true;
              }

              var msg = arg.msg || arg.message || arg.shortMessage || arg.reason || arg.details || '';
              if (typeof msg === 'string') {
                var ms = msg.toLowerCase();
                if (
                  msg.indexOf('APKT002') !== -1 ||
                  msg.indexOf('allow list') !== -1 ||
                  msg.indexOf('ORIGIN_NOT_ALLOWED') !== -1 ||
                  ms.indexOf('relay.walletconnect') !== -1 ||
                  ms.indexOf('walletconnect.org') !== -1 ||
                  ms.indexOf('socket connection') !== -1 ||
                  ms.indexOf('couldn\'t establish socket connection') !== -1 ||
                  ms.indexOf('websocket connection closed') !== -1 ||
                  ms.indexOf('unauthorized: origin not allowed') !== -1 ||
                  ms.indexOf('core/subscription') !== -1 ||
                  ms.indexOf('code: 3000') !== -1 ||
                  ms.indexOf('siwxutil') !== -1 ||
                  ms.indexOf('popup window was blocked') !== -1 ||
                  ms.indexOf('popup was blocked') !== -1 ||
                  ms.indexOf('popup_blocked') !== -1 ||
                  ms.indexOf('getethjsonrpcerror') !== -1 ||
                  ms.indexOf('user rejected') !== -1 ||
                  ms.indexOf('user rejected the request') !== -1 ||
                  ms.indexOf('action_rejected') !== -1 ||
                  ms.indexOf('on-chain execution failed') !== -1 ||
                  ms.indexOf('execution reverted') !== -1 ||
                  ms.indexOf('call_exception') !== -1 ||
                  ms.indexOf('estimategas') !== -1 ||
                  ms.indexOf('0x1b10b0f9') !== -1
                ) {
                  return true;
                }
              }

              try {
                var str = JSON.stringify(arg).toLowerCase();
                if (
                  str.indexOf('relay.walletconnect') !== -1 ||
                  str.indexOf('walletconnect.org') !== -1 ||
                  str.indexOf('socket connection') !== -1 ||
                  str.indexOf('unauthorized: origin not allowed') !== -1 ||
                  str.indexOf('core/subscription') !== -1 ||
                  str.indexOf('code: 3000') !== -1 ||
                  str.indexOf('popup window was blocked') !== -1 ||
                  str.indexOf('popup was blocked') !== -1 ||
                  str.indexOf('popup_blocked') !== -1 ||
                  str.indexOf('getethjsonrpcerror') !== -1 ||
                  str.indexOf('user rejected') !== -1 ||
                  str.indexOf('action_rejected') !== -1 ||
                  str.indexOf('4001') !== -1 ||
                  str.indexOf('execution reverted') !== -1 ||
                  str.indexOf('0x1b10b0f9') !== -1 ||
                  str.indexOf('call_exception') !== -1
                ) {
                  return true;
                }
              } catch (e) {}
            }
          }
          return false;
        };

        // 2. Wrap console methods
        try {
          var origError = console.error;
          console.error = function() {
            if (isSuppressed(arguments)) return;
            origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            if (isSuppressed(arguments)) return;
            origWarn.apply(console, arguments);
          };

          var origLog = console.log;
          console.log = function() {
            if (isSuppressed(arguments)) return;
            origLog.apply(console, arguments);
          };

          var origInfo = console.info;
          if (origInfo) {
            console.info = function() {
              if (isSuppressed(arguments)) return;
              origInfo.apply(console, arguments);
            };
          }

          var origDebug = console.debug;
          if (origDebug) {
            console.debug = function() {
              if (isSuppressed(arguments)) return;
              origDebug.apply(console, arguments);
            };
          }
        } catch (e) {}

        // 3. Prevent unhandled error and rejection propagation
        try {
          window.addEventListener('error', function(e) {
            var msg = ((e && e.message) || '').toLowerCase();
            var errMsg = ((e && e.error && e.error.message) || '').toLowerCase();
            var errCode = (e && e.error && (e.error.code || e.error.status)) || '';
            var errStack = ((e && e.error && e.error.stack) || '').toLowerCase();
            if (
              msg.indexOf('relay.walletconnect') !== -1 ||
              msg.indexOf('websocket connection closed') !== -1 ||
              msg.indexOf('unauthorized: origin not allowed') !== -1 ||
              msg.indexOf('core/subscription') !== -1 ||
              msg.indexOf('socket connection') !== -1 ||
              msg.indexOf('popup window was blocked') !== -1 ||
              msg.indexOf('popup was blocked') !== -1 ||
              msg.indexOf('popup_blocked') !== -1 ||
              msg.indexOf('getethjsonrpcerror') !== -1 ||
              msg.indexOf('user rejected') !== -1 ||
              msg.indexOf('action_rejected') !== -1 ||
              msg.indexOf('execution reverted') !== -1 ||
              msg.indexOf('call_exception') !== -1 ||
              msg.indexOf('0x1b10b0f9') !== -1 ||
              errMsg.indexOf('relay.walletconnect') !== -1 ||
              errMsg.indexOf('websocket connection closed') !== -1 ||
              errMsg.indexOf('unauthorized: origin not allowed') !== -1 ||
              errMsg.indexOf('core/subscription') !== -1 ||
              errMsg.indexOf('socket connection') !== -1 ||
              errMsg.indexOf('popup window was blocked') !== -1 ||
              errMsg.indexOf('popup was blocked') !== -1 ||
              errMsg.indexOf('popup_blocked') !== -1 ||
              errMsg.indexOf('getethjsonrpcerror') !== -1 ||
              errMsg.indexOf('user rejected') !== -1 ||
              errMsg.indexOf('action_rejected') !== -1 ||
              errMsg.indexOf('execution reverted') !== -1 ||
              errMsg.indexOf('call_exception') !== -1 ||
              errMsg.indexOf('0x1b10b0f9') !== -1 ||
              errStack.indexOf('popup window was blocked') !== -1 ||
              errStack.indexOf('user rejected') !== -1 ||
              errCode === 'CALL_EXCEPTION' ||
              errCode === 3000 ||
              errCode === 4001 ||
              errCode === '4001' ||
              errCode === 'ACTION_REJECTED'
            ) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var reason = e && e.reason;
            var reasonMsg = (typeof reason === 'string' ? reason : ((reason && (reason.message || reason.shortMessage)) || '')).toLowerCase();
            var reasonCode = (reason && (reason.code || reason.status)) || '';
            var reasonStack = ((reason && reason.stack) || '').toLowerCase();
            if (
              reasonMsg.indexOf('relay.walletconnect') !== -1 ||
              reasonMsg.indexOf('websocket connection closed') !== -1 ||
              reasonMsg.indexOf('unauthorized: origin not allowed') !== -1 ||
              reasonMsg.indexOf('core/subscription') !== -1 ||
              reasonMsg.indexOf('socket connection') !== -1 ||
              reasonMsg.indexOf('popup window was blocked') !== -1 ||
              reasonMsg.indexOf('popup was blocked') !== -1 ||
              reasonMsg.indexOf('popup_blocked') !== -1 ||
              reasonMsg.indexOf('getethjsonrpcerror') !== -1 ||
              reasonMsg.indexOf('user rejected') !== -1 ||
              reasonMsg.indexOf('action_rejected') !== -1 ||
              reasonMsg.indexOf('execution reverted') !== -1 ||
              reasonMsg.indexOf('call_exception') !== -1 ||
              reasonMsg.indexOf('0x1b10b0f9') !== -1 ||
              reasonStack.indexOf('popup window was blocked') !== -1 ||
              reasonStack.indexOf('user rejected') !== -1 ||
              reasonCode === 'CALL_EXCEPTION' ||
              reasonCode === 3000 ||
              reasonCode === 4001 ||
              reasonCode === '4001' ||
              reasonCode === 'ACTION_REJECTED'
            ) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (e) {}

        // 4. Safe window.open wrapper to prevent blocked popup rejections in sandbox iframe
        try {
          if (typeof window !== 'undefined') {
            var origOpen = window.open;
            window.open = function(url, target, features) {
              var urlStr = typeof url === 'string' ? url : (url ? url.toString() : '');
              try {
                var res = origOpen.apply(window, arguments);
                if (!res && (urlStr.indexOf('coinbase') !== -1 || (features && features.indexOf('width=420') !== -1))) {
                  return {
                    closed: false,
                    focus: function() {},
                    blur: function() {},
                    close: function() { this.closed = true; },
                    location: { href: urlStr },
                    postMessage: function() {}
                  };
                }
                return res;
              } catch (err) {
                if (urlStr.indexOf('coinbase') !== -1 || (features && features.indexOf('width=420') !== -1)) {
                  return {
                    closed: false,
                    focus: function() {},
                    blur: function() {},
                    close: function() { this.closed = true; },
                    location: { href: urlStr },
                    postMessage: function() {}
                  };
                }
                return null;
              }
            };
          }
        } catch (e) {}

        // 0. Purge stale WalletConnect relay subscriptions and storage
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            var keysToPurge = [];
            for (var idx = 0; idx < window.localStorage.length; idx++) {
              var keyName = window.localStorage.key(idx);
              if (keyName && (keyName.indexOf('wc@2') === 0 || keyName.indexOf('walletconnect') !== -1 || keyName.indexOf('relay') !== -1)) {
                keysToPurge.push(keyName);
              }
            }
            keysToPurge.forEach(function(k) {
              try { window.localStorage.removeItem(k); } catch(e) {}
            });
          }
        } catch(e) {}

        // 5. Completely remove wss:relay network connections and provide an isolated mock
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            function SafeRelaySocket(url, protocols) {
              var urlStr = typeof url === 'string' ? url : (url ? url.toString() : '');
              var lower = urlStr.toLowerCase();
              if (lower.indexOf('walletconnect') !== -1 || lower.indexOf('relay.') !== -1 || lower.indexOf('wss://relay') !== -1 || lower.indexOf('ws://relay') !== -1) {
                var self = this;
                var emitter = new EventTarget();
                this.url = urlStr;
                this.protocols = protocols;
                this.readyState = 1; // Immediately OPEN
                this.bufferedAmount = 0;
                this.extensions = '';
                this.protocol = '';
                this.binaryType = 'blob';
                this.onopen = null;
                this.onclose = null;
                this.onerror = null;
                this.onmessage = null;

                this.addEventListener = function(t, l, o) { emitter.addEventListener(t, l, o); };
                this.removeEventListener = function(t, l, o) { emitter.removeEventListener(t, l, o); };
                this.dispatchEvent = function(ev) { return emitter.dispatchEvent(ev); };

                var handlers = {};
                this.on = function(evt, fn) {
                  if (!handlers[evt]) handlers[evt] = [];
                  handlers[evt].push(fn);
                  return self;
                };
                this.once = function(evt, fn) {
                  var wrapper = function() {
                    self.off(evt, wrapper);
                    fn.apply(self, arguments);
                  };
                  return self.on(evt, wrapper);
                };
                this.off = function(evt, fn) {
                  if (handlers[evt]) {
                    handlers[evt] = handlers[evt].filter(function(h) { return h !== fn; });
                  }
                  return self;
                };
                this.removeListener = this.off;
                this.emit = function(evt) {
                  var args = Array.prototype.slice.call(arguments, 1);
                  if (handlers[evt]) {
                    handlers[evt].forEach(function(h) {
                      try { h.apply(self, args); } catch(err) {}
                    });
                  }
                  return true;
                };

                setTimeout(function() {
                  var ev = new Event('open');
                  if (typeof self.onopen === 'function') {
                    try { self.onopen.call(self, ev); } catch (err) {}
                  }
                  self.dispatchEvent(ev);
                  self.emit('open');
                }, 0);

                this.send = function(data) {
                  if (typeof data === 'string') {
                    try {
                      var parsed = JSON.parse(data);
                      if (parsed && parsed.id) {
                        setTimeout(function() {
                          if (self.readyState === 1) {
                            var res = JSON.stringify({
                              id: parsed.id,
                              jsonrpc: '2.0',
                              result: true
                            });
                            var msgEv = new MessageEvent('message', { data: res });
                            if (typeof self.onmessage === 'function') {
                              try { self.onmessage.call(self, msgEv); } catch (err) {}
                            }
                            self.dispatchEvent(msgEv);
                            self.emit('payload', JSON.parse(res));
                          }
                        }, 5);
                      }
                    } catch (err) {}
                  }
                };

                this.close = function(code, reason) {
                  self.readyState = 3; // CLOSED
                  var closeEv = new CloseEvent('close', { code: 1000, reason: reason || 'Normal Closure', wasClean: true });
                  if (typeof self.onclose === 'function') {
                    try { self.onclose.call(self, closeEv); } catch (err) {}
                  }
                  self.dispatchEvent(closeEv);
                  self.emit('close', closeEv);
                };

                return this;
              }

              return new OrigWebSocket(url, protocols);
            }

            SafeRelaySocket.CONNECTING = 0;
            SafeRelaySocket.OPEN = 1;
            SafeRelaySocket.CLOSING = 2;
            SafeRelaySocket.CLOSED = 3;
            SafeRelaySocket.prototype = OrigWebSocket.prototype;

            window.WebSocket = SafeRelaySocket;
            if (typeof globalThis !== 'undefined') {
              globalThis.WebSocket = SafeRelaySocket;
            }
            if (typeof self !== 'undefined') {
              self.WebSocket = SafeRelaySocket;
            }
          }
        } catch (e) {}

        // 5. Intercept window.fetch for /projects/v1/origins to return allow-listed origins
        try {
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            var urlStr = '';
            if (typeof input === 'string') {
              urlStr = input;
            } else if (input && typeof input.href === 'string') {
              urlStr = input.href;
            } else if (input && typeof input.url === 'string') {
              urlStr = input.url;
            } else {
              try { urlStr = String(input); } catch (e) {}
            }

            if (urlStr && urlStr.indexOf('/projects/v1/origins') !== -1) {
              var curOrigin = window.location.origin;
              return Promise.resolve(new Response(JSON.stringify({
                allowedOrigins: [
                  curOrigin,
                  'https://ais-dev-ja5bxfubtuwvo2twvjhgbz-597785414255.us-east1.run.app',
                  'https://ais-pre-ja5bxfubtuwvo2twvjhgbz-597785414255.us-east1.run.app',
                  'https://bushido.protocol',
                  '*'
                ]
              }), {
                status: 200,
                statusText: 'OK',
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            return origFetch.apply(this, arguments);
          };
        } catch (err) {}
      })();
