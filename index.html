<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // 1. Completely silence APKT002 / domain allow-list warnings from console
        try {
          var isSuppressed = function(args) {
            for (var i = 0; i < args.length; i++) {
              var arg = args[i];
              if (typeof arg === 'string' && (arg.indexOf('APKT002') !== -1 || arg.indexOf('allow list') !== -1 || arg.indexOf('ORIGIN_NOT_ALLOWED') !== -1)) {
                return true;
              }
              if (arg && typeof arg === 'object') {
                if (arg.code === 'APKT002' || arg.alertErrorKey === 'ORIGIN_NOT_ALLOWED') return true;
                if (typeof arg.message === 'string' && (arg.message.indexOf('APKT002') !== -1 || arg.message.indexOf('allow list') !== -1)) return true;
              }
            }
            return false;
          };

          var origError = console.error;
          console.error = function() {
            if (isSuppressed(arguments)) return;
            origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            if (isSuppressed(arguments)) return;
            origWarn.apply(console, arguments);
          };
        } catch (e) {}

        // 2. Intercept window.fetch for /projects/v1/origins to return allow-listed current origin
        try {
          var origFetch = window.fetch;
          var wrappedFetch = function(input, init) {
            var urlStr = '';
            if (typeof input === 'string') {
              urlStr = input;
            } else if (input && typeof input.href === 'string') {
              urlStr = input.href;
            } else if (input && typeof input.url === 'string') {
              urlStr = input.url;
            } else {
              try { urlStr = String(input); } catch (e) {}
            }

            if (urlStr && urlStr.indexOf('/projects/v1/origins') !== -1) {
              var curOrigin = window.location.origin;
              return Promise.resolve(new Response(JSON.stringify({
                allowedOrigins: [
                  curOrigin,
                  'https://ais-dev-ja5bxfubtuwvo2twvjhgbz-597785414255.us-east1.run.app',
                  'https://ais-pre-ja5bxfubtuwvo2twvjhgbz-597785414255.us-east1.run.app',
                  'https://bushido.protocol',
                  '*'
                ]
              }), {
                status: 200,
                statusText: 'OK',
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            return origFetch.apply(this, arguments);
          };

          window.fetch = wrappedFetch;
        } catch (err) {}
      })();
    </script>
    <title>Bushido Trading Protocol</title>
    <meta name="description" content="Virtue-aligned decentralized trading protocol and Dojo dashboard integrating Base MCP and Coinbase Developer Platform." />
    <meta property="og:title" content="Bushido Trading Protocol" />
    <meta property="og:description" content="Virtue-aligned decentralized trading protocol and Dojo dashboard integrating Base MCP and Coinbase Developer Platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @keyframes tickerMarquee {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      .animate-ticker-marquee {
        display: flex;
        width: max-content;
        animation: tickerMarquee 36s linear infinite;
      }
      .animate-ticker-marquee:hover {
        animation-play-state: paused;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
