name: roadmap

on:
  push:
    branches: [main]
    paths: ["roadmap/**", ".github/workflows/roadmap.yml"]
  pull_request:
    paths: ["roadmap/**", ".github/workflows/roadmap.yml"]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roadmap/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py
      - run: pytest -q

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadmap/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: forge build --sizes
      - run: forge test -vv
      - name: Fork test against real Base prices
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: forge test --match-path 'test/fork/*' -vv

  docker:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bushido-roadmap roadmap
