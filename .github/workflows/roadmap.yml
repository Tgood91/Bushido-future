name: roadmap

on:
  push:
    paths: ["roadmap/**", ".github/workflows/roadmap.yml"]
  pull_request:
    paths: ["roadmap/**", ".github/workflows/roadmap.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roadmap/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bushido-roadmap roadmap
