# Builds and checks the Bushido Future Android app (android/) on pushes to main and pull requests that touch it.
# Unit tests, Android lint and a debug build. Release builds are signed on the owner's machine (see android/README.md).
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle downloads and checks gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug build
        run: ./gradlew --stacktrace test lint assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bushido-future-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
